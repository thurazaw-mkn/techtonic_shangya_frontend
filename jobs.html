<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marquee Background</title>
    <link rel="stylesheet" href="./assets/css/typography.css" />
    <link rel="stylesheet" href="./assets/css/jobs.css" />
  </head>
  <body>
    <section class="marquee-bg">
      <section class="content">
        <h1>Welcome to ShangYa Consultancy</h1>
        <p>Empowering careers for over 20 years.</p>
      </section>
    </section>
    <section class="find-job-section">
      <section class="center-item">
        <h1>Find Jobs</h1>
      </section>
      <section class="center-item">
        <section class="space-item">
          <input class="search-bar" type="text" placeholder="Search Location..." />
          <input
            class="search-bar"
            type="text"
            placeholder="Search Location..."
          />
        </section>
      </section>

      <section class="center-item space-item tag-section">
        <label>
          <input type="checkbox" >
          <span class="find-job-section-tag">Freelance</span>
        </label>
        <label>
          <input type="checkbox" >
          <span class="find-job-section-tag">Fulltime</span>
        </label><label>
          <input type="checkbox" >
          <span class="find-job-section-tag">Part-Time</span>
          <label>
            <input type="checkbox" >
            <span class="find-job-section-tag">Internship</span>
          </label>
        </label><button type="button">Search</button>
      </section>

      
    </section>
