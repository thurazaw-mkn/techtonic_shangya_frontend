<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marquee Background</title>

    <style>
      body {
        margin: 0;
        padding: 0;
      }

      .marquee-bg {
        height: 300px;
        background-image: url("./assets/img/crossline.png");
        background-repeat: repeat-x;
        background-size: auto 100%;
        background-position: 0 50%;
        animation: marqueeScroll 20s linear infinite;
        position: relative;
        overflow: hidden;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      @keyframes marqueeScroll {
        0% {
          background-position: 0 50%;
        }
        100% {
          background-position: -1000px 50%;
        }
      }

      .marquee-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 0;
      }

      .marquee-bg .content {
        position: relative;
        z-index: 1;
        color: #fff;
        padding: 1rem;
      }

      .marquee-bg h1 {
        margin: 0;
        font-size: 2.5rem;
      }

      .marquee-bg p {
        font-size: 1.2rem;
      }
    </style>
  </head>
  <body>
    <div class="marquee-bg">
      <div class="content">
        <h1>Welcome to ShangYa Consultancy</h1>
        <p>Empowering careers for over 20 years.</p>
      </div>
    </div>
  </body>
</html>
