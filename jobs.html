  <body>
    <header class="navbar">
      <div class="container nav-content">
        <div class="logo">SHANGYA</div>
        <nav class="nav-links">

    <section class="find-job-section">
      <section class="search-section">
        <article class="center-item">
          <h1>Find Jobs</h1>
        </article>

        <section class="center-item">
          <section class="space-item">
            <input
              class="search-bar"
              type="text"
              placeholder="Search Jobs..."
            />
            <input
              class="search-bar"
              type="text"
              placeholder="Search Location..."
            />
          </section>
        </section>

        <section class="center-item space-item tag-section">
          <label>
            <input type="checkbox" />
            <span class="find-job-section-tag">Freelance</span>
          </label>
          <label>
            <input type="checkbox" />
            <span class="find-job-section-tag">Fulltime</span> </label
          ><label>
            <input type="checkbox" />
            <span class="find-job-section-tag">Part-Time</span></label
          >
          <label>
            <input type="checkbox" />
            <span class="find-job-section-tag">Internship</span>
          </label>
          <button class="search-btn" type="button">Search</button>
        </section>
      </section>
      <section class="card-section">
        <section class="space-card">
          <section class="job-card">
            <article class="space-item">
              <img
                class="company-logo"
                src="https://global.toyota/pages/global_toyota/mobility/toyota-brand/emblem_001.jpg"
                alt="company logo"
              />

            </article>
            <section class="space-card-text">
              <article class="card-text">
                <h4>offer postion</h4>
                <p>Data Manager</p>
              </article>
              <article class="card-text">
                <h4>Location</h4>

              </article>
              <article class="card-text">
                <h4>Requirement</h4>
                <p>cant remember anything</p>
              </article>

            <section class="card-footer">
              <p>Posted 3 days ago</p>
            </section>
          </section>

          <section class="job-card">
            <article class="space-item">
              <img
                class="company-logo"
                src="https://global.toyota/pages/global_toyota/mobility/toyota-brand/emblem_001.jpg"
                alt="company logo"
              />
              <h3 class="company-name">Company Name</h3>
            </article>
            <section class="space-card-text">
              <article class="card-text">
                <h4>offer postion</h4>
                <p>Software Engineer</p>
              </article>
