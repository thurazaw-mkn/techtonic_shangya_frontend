<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enhancements Page</title>
  <link rel="stylesheet" href="../assets/css/typography.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/enhancement-damian.css" />
</head>

<body>

  <section class="ehm-wrapper">

    <section class="ehm-collapsible">

      <input type="checkbox" id="collapsible-head-4" style="visibility: hidden;">
      <label for="collapsible-head-4">File Structure</label>
      
      <section class="collapsible-text">

        <section class="ehm-collapsible">
          <input type="checkbox" id="collapsible-head" style="visibility: hidden;">
          <label for="collapsible-head">Assets</label>
          <section class="collapsible-text">
            <!-- Add nested collapsible sections here -->
            <section class="ehm-collapsible">
              <input type="checkbox" id="collapsible-head-css" style="visibility: hidden;">
              <label for="collapsible-head-css">CSS</label>
              <section class="collapsible-text">
                <p>style.css</p>               
              </section>
            </section>
            
            <section class="ehm-collapsible">
              <input type="checkbox" id="collapsible-head-img" style="visibility: hidden;">
              <label for="collapsible-head-img">IMG</label>
              <section class="collapsible-text">
                <p>logo.png</p>
                <p>banner.jpg</p>
                <p>teamlogo_techtonic.png</p>
              </section>
            </section>
          </section>
        </section>

        <section class="ehm-collapsible">
          <input type="checkbox" id="collapsible-head-2" style="visibility: hidden;">
          <label for="collapsible-head-2">Pages</label>
          <section class="collapsible-text">
            <h2>Pages</h2>
            <p>
              about_company.html
            </p>
          </section>
        </section>

        <section class="ehm-text2">
          <section class="file-row">
            <h6>about.html</h6>
            <h6>apply.html</h6>
          </section>
          <section class="file-row">
            <h6>index.html</h6>
            <h6>enchancement.html</h6>
            <h6>jobs.html</h6>
          </section>
        </section>
      </section>
    </section>

    <!-- Add the responsive screenshots section -->
    <section class="responsive-showcase">
      <section class="screenshot-container">
        <div class="screenshot-with-caption">
          <img src="../assets/img/laptop-view.png" alt="Desktop View" class="screenshot desktop-screenshot">
          <p class="screenshot-caption">desktop-view</p>
        </div>
        <div class="screenshot-with-caption">
          <img src="../assets/img/phone-view.png" alt="Mobile View" class="screenshot mobile-screenshot">
          <p class="screenshot-caption">Mobile-view</p>
        </div>
      </section>
    </section>

  </section>

</body>

</html>
